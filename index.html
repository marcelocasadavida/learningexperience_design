<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learning Experience da Casa da Vida: desenhe uma forma 3D usando perspectiva com um ponto de fuga.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ponto de Fuga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
:root{
  --blue:#2146F5; --blue-ink:#1532B8; --orange:#F37321; --green:#7DBB35; --green-deep:#4E8A12; --pink:#D63A92;
  --cream:#FDF1E4; --bg:#FFFCF8; --surface:#FFFFFF; --ink:#141A33; --muted:#5C6178; --line:#E9E1D6;
  --soft-green:#EEF7E2; --soft-orange:#FEEBDD; --soft-pink:#FBE6F1; --soft-blue:#E6EBFF;
  --paper:#FFFFFF; --pencil:#1C1F2B; --guide:#B9B4AC;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1224; --surface:#171B33; --ink:#F2EEE8; --muted:#A7AAC0; --line:#2A2F4D; --cream:#1B1F3A;
    --soft-green:#1D2B17; --soft-orange:#33200F; --soft-pink:#33152A; --soft-blue:#18224F;
    --green-deep:#A5DB67; --blue-ink:#9BAEFF; --paper:#F7F4EF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1224; --surface:#171B33; --ink:#F2EEE8; --muted:#A7AAC0; --line:#2A2F4D; --cream:#1B1F3A;
  --soft-green:#1D2B17; --soft-orange:#33200F; --soft-pink:#33152A; --soft-blue:#18224F;
  --green-deep:#A5DB67; --blue-ink:#9BAEFF; --paper:#F7F4EF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--blue-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.crumb b{font-weight:800}
.crumb .tag{background:var(--orange);color:#fff;font-weight:800;padding:1px 7px;border-radius:4px}
.crumb .count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{display:flex;gap:4px;align-items:center}
.seg{flex:1;height:6px;border-radius:3px;background:var(--line);border:0;padding:0;position:relative}
.seg.done{background:var(--c)}
.seg.now{background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.seg[disabled]{cursor:default}

/* hex */
.hex{--s:44px;width:var(--s);height:calc(var(--s)*1.1);display:inline-grid;place-items:center;flex:none;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);color:#fff;
  font:800 calc(var(--s)*.45)/1 var(--display)}
.F{--c:var(--orange);--soft:var(--soft-orange)} .E{--c:var(--green);--soft:var(--soft-green)} .R{--c:var(--pink);--soft:var(--soft-pink)} .I{--c:var(--blue);--soft:var(--soft-blue)}

main{max-width:960px;margin:0 auto;padding:28px 16px 120px}
.step{display:flex;flex-direction:column;gap:22px;animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
.head{display:flex;gap:16px;align-items:flex-start}
.head .kick{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.head h2{font-size:clamp(26px,4.2vw,38px);margin-top:4px}
.opt{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;vertical-align:2px}
.lead{font-size:19px;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch}
mark{background:none;color:inherit;font-weight:800;box-shadow:inset 0 -.45em 0 var(--soft)}

.two{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
@media (max-width:760px){.two{grid-template-columns:1fr}}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{border-radius:var(--r);border:1px solid var(--line);display:block;width:100%;background:#fff}
figcaption{font-size:14px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.gallery{grid-template-columns:1fr}}

/* hero */
.hero{background:var(--blue);color:#fff;border-radius:22px;padding:clamp(24px,5vw,48px);display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;overflow:hidden}
.hero img{width:100%;max-width:340px;justify-self:center}
.hero .eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;margin:10px 0 12px}
.hero .pill{display:inline-block;background:var(--orange);font-weight:800;padding:3px 12px;border-radius:6px}
.hero p{max-width:40ch;font-size:18px;margin-top:16px;opacity:.95}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;font-weight:600}
.meta span{display:flex;gap:6px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero img{max-width:200px;order:-1}}

/* FER cards */
.fer{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.fer{grid-template-columns:1fr}}
.fer article{background:var(--soft);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.fer h3{font-size:22px;color:var(--ink)}
.fer ul{margin:0;padding-left:18px}
.fer .when{font-size:14px;font-weight:800;color:var(--c)}

/* chooser */
.materials{display:flex;gap:10px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.materials .chip{color:var(--ink);border-color:var(--line);cursor:default}
.materials .ok{color:var(--green-deep);font-weight:800}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:15px}
.chip input{accent-color:var(--green);width:18px;height:18px;margin:0}
.chip:has(input:checked){border-color:var(--green);background:var(--soft-green)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.tab b{font-family:var(--display);font-size:19px}
.tab small{color:var(--muted);font-size:13px;line-height:1.35}
.tab[aria-selected="true"]{border-color:var(--green);background:var(--soft-green)}
.tab:hover{border-color:var(--green)}
@media (max-width:560px){.tabs{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px)}

/* infographic */
.info{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:center}
@media (max-width:760px){.info{grid-template-columns:1fr}}
.canvas{background:var(--paper);border:3px solid #111;border-radius:4px;aspect-ratio:600/360;width:100%;max-width:100%}
.canvas svg{display:block;width:100%;height:100%}
.guide{stroke:var(--guide);stroke-width:1.4;fill:none}
.ink{stroke:var(--pencil);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bold{stroke-width:4}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
.hide{opacity:0;transition:opacity .4s}
.faded{opacity:.25;transition:opacity .5s}
.stepno{display:flex;gap:6px;flex-wrap:wrap}
.stepno button{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-variant-numeric:tabular-nums}
.stepno button.on{background:var(--green);border-color:var(--green);color:#fff}
.stepno button.seen{border-color:var(--green)}
.instr{display:flex;flex-direction:column;gap:14px}
.instr h3{font-size:24px}
.instr .n{color:var(--green-deep);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:16px;text-decoration:none;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.go{background:var(--c,var(--blue));color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.light{background:#fff;color:var(--blue)}

.video{position:relative;display:block;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.video img{display:block;width:100%}
.video .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,40,.35);transition:background .2s}
.video:hover .play{background:rgba(10,14,40,.2)}
.video .play span{background:#fff;color:#111;border-radius:99px;padding:12px 22px;font-weight:800;display:flex;gap:10px;align-items:center}

/* checkpoint */
.check{display:flex;gap:14px;align-items:flex-start;background:var(--soft-green);border-radius:var(--r);padding:18px 20px;cursor:pointer;font-weight:600;max-width:62ch}
.check input{width:22px;height:22px;accent-color:var(--green-deep);margin:2px 0 0;flex:none}
.big-note{background:var(--green);color:#fff;border-radius:20px;padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:12px}
.big-note h3{font-size:clamp(24px,3.4vw,32px)}
.big-note p{max-width:56ch;font-size:18px}

/* AI prompt */
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.steps3 b{color:var(--green-deep);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.steps3{padding:0;margin:0}
.prompt{border:2px dashed var(--green);border-radius:var(--r);padding:18px 20px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.prompt pre{margin:0;white-space:pre-wrap;font:400 15px/1.55 var(--body);color:var(--ink)}
.prompt .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prompt .top span{font-weight:800;color:var(--green-deep);font-size:13px;letter-spacing:.08em;text-transform:uppercase}

.views{display:flex;flex-direction:column;gap:12px}
.views div{display:flex;gap:12px;align-items:flex-start}
.views .num{flex:none;width:30px;height:30px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}

input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--surface);color:var(--ink)}
input[type=text]:focus{border-color:var(--green);outline:none}
#char-chips button[aria-pressed="true"]{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.tipbox{background:var(--soft-green);border-radius:12px;padding:14px 16px}
.edu{border:2px solid var(--blue);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:6px;max-width:760px}
.edu b{color:var(--blue-ink);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
/* quiz */
.q{display:flex;flex-direction:column;gap:10px;max-width:680px}
.opt-q{display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600;text-align:left;width:100%}
.opt-q .l{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft-pink);color:var(--pink);font-weight:800}
.opt-q:hover{border-color:var(--pink)}
.opt-q.sel{border-color:var(--pink);background:var(--soft-pink)}
.opt-q.right{border-color:var(--green-deep);background:var(--soft-green)}
.opt-q.right .l{background:var(--green);color:#fff}
.opt-q.partial{border-color:var(--orange);background:var(--soft-orange)}
.fb{border-radius:12px;padding:16px 18px;max-width:680px;font-weight:600}
.fb.ok{background:var(--soft-green)} .fb.meh{background:var(--soft-orange)}

.reflect{display:grid;gap:14px;max-width:680px}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--pink);outline:none}
label.q-label{font-weight:800}

.finale{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(24px,5vw,44px);display:flex;flex-direction:column;gap:16px}
.finale h2{font-size:clamp(30px,5vw,46px)}
.finale .hexes{display:flex;gap:6px}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.recap{grid-template-columns:1fr}}
.recap div{background:rgba(255,255,255,.07);border-radius:12px;padding:14px;font-size:15px}
:root[data-theme="dark"] .recap div{background:rgba(0,0,0,.06)}

/* footer nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav .where{font-size:14px;color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.nav .where{display:none}.nav-in .btn{flex:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;z-index:20}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="crumb"><span><b>Learning Experience</b> · Casa da Vida · <span class="tag">Design</span></span><span class="count" id="count"></span></div>
    <div class="track" id="track" aria-label="Progresso"></div>
  </div>
</header>

<main id="app"></main>

<nav class="nav" aria-label="Navegação entre etapas">
  <div class="nav-in">
    <button class="btn ghost" id="prev">← Voltar</button>
    <div class="where" id="where"></div>
    <button class="btn primary" id="next">Continuar →</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<template id="t-intro">
  <section class="step">
    <div class="hero">
      <div>
        <div class="eyebrow">Learning Experience · Design</div>

    <p class="lead">Em todas as atividades da Casa da Vida você vai passar por três momentos. Eles aparecem aqui em cima, na barra de progresso, com essas mesmas cores.</p>

      <article class="E"><span class="hex">E</span><h3>Experimentar</h3><div class="when">Agora é a hora de:</div><ul><li>Testar as ideias</li><li>Criar</li><li>Errar</li><li>Refazer se precisar</li></ul></article>

<template id="t-what">
  <section class="step F">
    <div class="head"><span class="hex">F</span><div><div class="kick">Familiarizar</div><h2>O que é perspectiva com um ponto de fuga?</h2></div></div>
    <div class="two">
      <div class="prose">
        <p class="lead"><mark>Perspectiva com um ponto de fuga</mark> é um desenho que usa um único ponto de fuga para criar a <mark>ilusão de profundidade</mark> numa obra de arte ou ilustração.</p>
        <p>Entender perspectiva é indispensável para quem gosta de apreciar boas artes, interpretar a aparência de volume dos objetos, a profundidade, o espaço de ambientes, paisagens e todo tipo de arte que busca <b>reproduzir as características tridimensionais da realidade</b>.</p>

        <div class="tipbox"><b>Truque: pense em caixas.</b> Cabeça é um cubo, corpo é um bloco alto, pés são blocos pequenos. Desenhe cada caixa como fez com o cubo, sempre usando o mesmo ponto de fuga.</div>
        <label class="q-label" for="char">Qual personagem você escolheu?</label>
        <div class="scale" id="char-chips"><button aria-pressed="false" data-v="Creeper">Creeper</button><button aria-pressed="false" data-v="">Outro personagem</button></div>
        <input id="char" type="text" placeholder="Ex.: Creeper, Steve, um robô que eu inventei..." autocomplete="off">
        <label class="q-label" for="why">Por que esse personagem?</label>

</template>

<template id="t-quiz">
  <section class="step R">
    <div class="head"><span class="hex">R</span><div><div class="kick">Refletir</div><h2>Por que esta atividade tem relação com a habilidade de aprender a aprender?</h2></div></div>
    <div class="q" id="q"></div>
    <div class="fb" id="fb" hidden></div>
  </section>
</template>

<template id="t-reflect">
  <section class="step R">
    <div class="head"><span class="hex">R</span><div><div class="kick">Refletir</div><h2>Olhe para o seu desenho</h2></div></div>
    <div class="reflect">
      <label class="q-label">Como foi pra você?</label>
      <div class="scale" id="scale">
        <button aria-pressed="false">Tranquilo</button><button aria-pressed="false">Na medida</button><button aria-pressed="false">Desafiador</button>
      </div>
      <label class="q-label" for="r-life">Onde você já viu (ou usaria) perspectiva na vida real?</label>
      <textarea id="r-life" placeholder="Ex.: fotos de rua, jogos, projetos de arquitetura, cenários de filme..."></textarea>
      <label class="q-label" for="r-next">Se fosse ensinar isso para alguém, qual seria a sua dica principal?</label>
      <textarea id="r-next" placeholder="Escreva em uma frase."></textarea>
      <p class="muted" style="font-size:14px">Suas respostas ficam só neste navegador. Use-as para conversar com o seu Guia ou com colegas e comparar desenhos.</p>
    </div>
  </section>
</template>

<template id="t-end">
  <section class="step">
    <div class="finale">
      <div class="hexes"><span class="hex F" style="--s:36px">F</span><span class="hex E" style="--s:36px">E</span><span class="hex R" style="--s:36px">R</span></div>
      <h2>Keep learning, keep growing.</h2>
      <p style="max-width:56ch;font-size:18px">Você completou a Learning Experience de perspectiva com um ponto de fuga. Agora você sabe transformar um quadrado num objeto com volume.</p>
      <div class="recap">
        <div><b>Familiarizou</b><br>O que é ponto de fuga e onde ele aparece.</div>
        <div><b>Experimentou</b><br><span id="exp-recap">Desenhou um cubo com linha do horizonte e guias.</span></div>
        <div><b>Refletiu</b><br>Conectou o desenho com o aprender a aprender.</div>
      </div>
      <div class="row"><button class="btn light" id="restart">Recomeçar a experiência</button></div>
    </div>
  </section>
</template>

<script>
(() => {
  const STEPS = [
    {id:'intro', g:'I', name:'Boas-vindas', next:'Começar'},
    {id:'fer',   g:'I', name:'O processo F·E·R'},
    {id:'what',  g:'F', name:'O que é ponto de fuga'},
    {id:'examples', g:'F', name:'Exemplos'},
    {id:'practice', g:'E', name:'Mão na massa'},
    {id:'done',  g:'E', name:'Checkpoint'},
    {id:'human', g:'E', name:'Vá além: novo desafio', opt:true},
    {id:'hero',  g:'E', name:'Vá além: seu personagem', opt:true},
    {id:'ai',    g:'E', name:'Vá além: Mentor AI', opt:true},
    {id:'quiz',  g:'R', name:'Aprender a aprender'},
    {id:'reflect', g:'R', name:'Sua reflexão'},
    {id:'end',   g:'I', name:'Conclusão'}
  ];
  const COLORS = {I:'var(--blue)',F:'var(--orange)',E:'var(--green)',R:'var(--pink)'};
  const KEY = 'lx-perspectiva-v1';
  let S = {i:0, max:0, tab:'info', inf:0, infMax:0, saved:false, quiz:null, scale:null, life:'', nxt:'', mats:{}, char:'', why:''};
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

  const $ = s => document.querySelector(s);
  const app = $('#app'), track = $('#track');

  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1800); }

  function renderTrack(){
    track.innerHTML='';
    STEPS.forEach((s,k)=>{
      const b=document.createElement('button');
      b.className='seg'+(k<S.i?' done':'')+(k===S.i?' now':'');
      b.style.setProperty('--c',COLORS[s.g]);
      b.title=s.name; b.setAttribute('aria-label',`Etapa ${k+1}: ${s.name}`);
      if(k>S.max) b.disabled=true; else b.onclick=()=>go(k);
      track.appendChild(b);
    });
    $('#count').textContent=`Etapa ${S.i+1} de ${STEPS.length}`;
  }

  function go(k){
    S.i=Math.max(0,Math.min(STEPS.length-1,k)); S.max=Math.max(S.max,S.i); save(); render();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function render(){
    const s=STEPS[S.i];
    app.innerHTML=''; app.appendChild(document.getElementById('t-'+s.id).content.cloneNode(true));
    renderTrack();
    const prev=$('#prev'), next=$('#next');
    prev.disabled = S.i===0;
    prev.style.visibility = S.i===0 ? 'hidden':'visible';
    next.hidden = S.i===STEPS.length-1;
    next.textContent = s.next ? s.next+' →' : (s.opt ? 'Continuar →' : 'Continuar →');
    $('#where').textContent = s.opt ? s.name+' · pode pular' : s.name;
    ({practice:initPractice, done:initDone, hero:initHero, ai:initAI, quiz:initQuiz, reflect:initReflect, end:initEnd}[s.id]||(()=>{}))();
  }

  $('#prev').onclick=()=>go(S.i-1);
  $('#next').onclick=()=>go(S.i+1);
  document.addEventListener('keydown',e=>{
    if(e.target.closest('textarea,input')) return;
    if(e.key==='ArrowRight') go(S.i+1);
    if(e.key==='ArrowLeft') go(S.i-1);
  });

  /* ---------- practice ---------- */
  function initPractice(){
    const tabs=document.querySelectorAll('.tab');
    const set=t=>{
      S.tab=t; save();
      tabs.forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
      const p=$('#panel'); p.innerHTML=''; p.appendChild(document.getElementById('p-'+t).content.cloneNode(true));
      if(t==='info') initInfo();
    };
    tabs.forEach(b=>b.onclick=()=>set(b.dataset.tab));
    set(S.tab||'info');
  }

  /* infographic geometry */
  const VP=[330,150], H=150;
  const F={tl:[150,232], tr:[240,232], br:[240,318], bl:[150,318]};
  const t=.32, toVP=p=>[p[0]+t*(VP[0]-p[0]), p[1]+t*(VP[1]-p[1])];
  const B={tl:toVP(F.tl), tr:toVP(F.tr), br:toVP(F.br)};
  const INFO=[
    {t:'Desenhe a linha do horizonte', d:'Uma linha reta e horizontal atravessando a folha. Ela representa a altura dos seus olhos.'},
    {t:'Marque o ponto de fuga', d:'Faça um pontinho em cima da linha do horizonte. É para lá que todas as linhas de profundidade vão correr.'},
    {t:'Desenhe a face da frente', d:'Um quadrado um pouco abaixo e para o lado do ponto de fuga. Essa é a frente do seu cubo.'},
    {t:'Ligue os cantos ao ponto', d:'Com traço bem leve, puxe linhas dos cantos do quadrado até o ponto de fuga. Só os cantos de fora, os que não ficam escondidos.'},
    {t:'Feche a face de trás', d:'Escolha a profundidade: desenhe uma linha horizontal e uma vertical entre as guias, paralelas ao quadrado.'},
    {t:'Reforce e apague as guias', d:'Passe o lápis com mais força no contorno do cubo e apague as linhas-guia. Pronto, você tem uma forma 3D!'}
  ];
  const L=(a,b,cls,anim)=>{const len=Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(0);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${cls}${anim?' draw':''}" style="--len:${len}"/>`;};
  function drawInfo(n){
    // n: 0..5 current step; show everything up to n, animate only n
    let out='';
    const a=k=>k===n;
    out+=L([10,H],[590,H],'guide'+(n>=5?'':''),a(0));
    if(n>=1) out+=`<circle cx="${VP[0]}" cy="${VP[1]}" r="${a(1)?6:4.5}" fill="var(--pencil)" ${a(1)?'class="draw"':''}/>`;
    const guides=n>=5?'guide faded':'guide';
    if(n>=3){ out+=L(F.tl,VP,guides,a(3))+L(F.tr,VP,guides,a(3))+L(F.br,VP,guides,a(3)); }
    if(n>=2){ const c=n>=5?'ink bold':'ink'; out+=L(F.tl,F.tr,c,a(2))+L(F.tr,F.br,c,a(2))+L(F.br,F.bl,c,a(2))+L(F.bl,F.tl,c,a(2)); }
    if(n>=4){ const c=n>=5?'ink bold':'ink'; out+=L(B.tl,B.tr,c,a(4))+L(B.tr,B.br,c,a(4)); }
    if(n>=5){ out+=L(F.tl,B.tl,'ink bold',true)+L(F.tr,B.tr,'ink bold',true)+L(F.br,B.br,'ink bold',true); }
    return out;
  }
  function initInfo(){
    const nums=$('#stepno');
    const show=n=>{
      S.inf=n; S.infMax=Math.max(S.infMax,n); save();
      $('#svg').innerHTML=drawInfo(n);
      $('#in-n').textContent=`Passo ${n+1} de 6`;
      $('#in-t').textContent=INFO[n].t; $('#in-d').textContent=INFO[n].d;
      nums.innerHTML='';
      INFO.forEach((_,k)=>{const b=document.createElement('button');b.textContent=k+1;b.className=(k===n?'on':'')+(k<=S.infMax?' seen':'');b.setAttribute('aria-label','Passo '+(k+1));b.onclick=()=>show(k);nums.appendChild(b);});
      $('#i-prev').disabled=n===0;
      const nx=$('#i-next');
      if(n===5){ nx.textContent='Terminei o cubo →'; nx.onclick=()=>{toast('Muito bem! Bora para o checkpoint.'); go(S.i+1);} }
      else { nx.textContent='Fiz esse passo ✓'; nx.onclick=()=>show(n+1); }
    };
    $('#i-prev').onclick=()=>show(Math.max(0,S.inf-1));
    show(S.inf||0);
  }

  /* ---------- checkpoint ---------- */
  function initDone(){
    const c=$('#saved'); c.checked=!!S.saved;
    c.onchange=()=>{S.saved=c.checked; save(); if(c.checked) toast('Desenho guardado ✓');};
  }

  /* ---------- AI ---------- */
  function initAI(){
    if(S.char){ $('#p-what').textContent='o personagem '+S.char; $('#ai-s1').textContent='Tire uma foto do seu desenho do '+S.char+' com o celular.'; }
    const btn=$('#copy'), txt=$('#prompt-text').textContent;
    btn.onclick=()=>{
      const fallback=()=>{const r=document.createRange();r.selectNodeContents($('#prompt-text'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado: use Ctrl+C');};
      try{ navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiado ✓';toast('Prompt copiado');setTimeout(()=>btn.textContent='Copiar prompt',2000);},fallback);}catch(e){fallback();}
    };
  }

  function initHero(){
    const inp=$('#char'), why=$('#why'), chips=document.querySelectorAll('#char-chips button');
    const sync=()=>chips.forEach(c=>c.setAttribute('aria-pressed', c.dataset.v ? S.char===c.dataset.v : (!!S.char && S.char!=='Creeper') || c===document.activeElement && !S.char));
    inp.value=S.char||''; why.value=S.why||'';
    chips.forEach(c=>c.onclick=()=>{ if(c.dataset.v){S.char=c.dataset.v; inp.value=c.dataset.v;} else { if(S.char==='Creeper'){S.char='';inp.value='';} inp.focus(); } save(); sync(); chips.forEach(x=>x.setAttribute('aria-pressed',x===c)); });
    inp.oninput=()=>{S.char=inp.value.trim(); save(); sync();};
    why.oninput=()=>{S.why=why.value; save();};
    sync();
  }

  /* ---------- quiz ---------- */
  const OPTS=[
    ['a','É uma atividade autodirigida','É verdade: você conduziu o próprio caminho. Mas tem mais coisa aqui.'],
    ['b','Tenho todos os ingredientes para aprender o básico de algo','Sim, você teve tudo que precisava. Mas essa não é a única razão.'],
    ['c','Permite diferentes formatos (infográfico, IA, vídeo, Google…) de aprender','Certo, você escolheu o formato. Mas ainda falta algo.'],
    ['d','Oferece níveis graduais de complexidade','Também é verdade: do cubo simples ao desafio extra. Mas não é só isso.'],
    ['e','Se gostei, posso ir além...','Sim, os passos "Vá além" existem para isso. Mas veja as outras opções.'],
    ['f','Todos os itens acima','']
  ];
  function initQuiz(){
    const q=$('#q'), fb=$('#fb');
    const paint=()=>{
      q.innerHTML='';
      OPTS.forEach(([l,txt])=>{
        const b=document.createElement('button');
        b.className='opt-q'+(S.quiz===l?(l==='f'?' right':' partial'):'');
        b.innerHTML=`<span class="l">${l}</span><span>${txt}</span>`;
        b.onclick=()=>{S.quiz=l; save(); paint();};
        q.appendChild(b);
      });
      if(!S.quiz){fb.hidden=true;return;}
      fb.hidden=false;
      if(S.quiz==='f'){fb.className='fb ok'; fb.innerHTML='<b>Isso!</b> Todos os itens juntos explicam o aprender a aprender: você decidiu o caminho, tinha os ingredientes, escolheu o formato, subiu de nível no seu ritmo e pôde ir além quando quis.';}
      else{fb.className='fb meh'; fb.textContent=OPTS.find(o=>o[0]===S.quiz)[2]+' Tente de novo.';}
    };
    paint();
  }

  /* ---------- reflect ---------- */
  function initReflect(){
    const labels=['Tranquilo','Na medida','Desafiador'];
    document.querySelectorAll('#scale button').forEach((b,k)=>{
      b.setAttribute('aria-pressed', S.scale===k);
      b.onclick=()=>{S.scale=k; save(); document.querySelectorAll('#scale button').forEach((x,j)=>x.setAttribute('aria-pressed',j===k));};
    });
    const life=$('#r-life'), nx=$('#r-next');
    life.value=S.life||''; nx.value=S.nxt||'';
    life.oninput=()=>{S.life=life.value; save();};
    nx.oninput=()=>{S.nxt=nx.value; save();};
  }

  function initEnd(){
    if(S.char) $('#exp-recap').textContent='Desenhou um cubo e depois o '+S.char+', tudo com um ponto de fuga.';
    $('#restart').onclick=()=>{S={i:0,max:0,tab:'info',inf:0,infMax:0,saved:false,quiz:null,scale:null,life:'',nxt:'',mats:{},char:'',why:''}; save(); render(); window.scrollTo({top:0});};
  }

  render();
})();
</script>
